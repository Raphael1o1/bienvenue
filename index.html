<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>Bienvenue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Mise en page : une colonne mobile (560 px max), onglets fixes en bas, fiches en panneau qui monte du bas */
:root{
  --bg:#FFFFFF; --alt:#F7F7F7; --ph:#EFEFEF; --ink:#222222; --ink2:#484848; --muted:#6A6A6A;
  --line:#DDDDDD; --line-soft:#EBEBEB; --line-strong:#B0B0B0;
  --accent:#D2364D; --accent-ink:#FFFFFF; --accent-text:#D2364D;
  --on:#222222; --on-ink:#FFFFFF;
  --ok:#1E7B4A; --ok-bg:#E8F5EE; --warn:#9A5600; --warn-bg:#FDF1E0; --warn-ink:#3D2A10; --warn-title:#7A4500;
  --crit:#C13515; --crit-bg:#FDECEA; --sos:#B42318; --sos-bg:#FDECEA;
  --ebike:#2E6DB4; --dot-works:#D98A1C;
  --enamel:#1D3F72; --frame:#2C6A4D;
  --shadow:0 6px 16px rgba(0,0,0,.08);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --plaque:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --gutter:max(20px, env(safe-area-inset-left, 0px));
  --gutter-r:max(20px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141414; --alt:#1F1F21; --ph:#29292B; --ink:#F2F2F2; --ink2:#D0D0D0; --muted:#A3A3A3;
    --line:#3A3A3C; --line-soft:#2A2A2C; --line-strong:#58585B;
    --accent-text:#FF7A8C; --on:#F2F2F2; --on-ink:#141414;
    --ok:#5BC98F; --ok-bg:#12291E; --warn:#F2A93B; --warn-bg:#2D2110; --warn-ink:#F3DDBA; --warn-title:#F2A93B;
    --crit:#FF7B6B; --crit-bg:#351815; --sos:#FF8A7A; --sos-bg:#351815;
    --ebike:#6FA8E8; --dot-works:#F2A93B;
    --shadow:0 6px 16px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
[hidden]{display:none!important}
img{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.pad{max-width:560px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter-r)}
.view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:13px}

/* En-têtes */
.vh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:max(18px, calc(env(safe-area-inset-top,0px) + 10px));padding-bottom:6px}
.vh h1{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.vh p{margin:4px 0 0;color:var(--muted);font-size:15px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.lang button{border:0;border-radius:999px;min-width:46px;height:44px;font-weight:600;font-size:14px;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
.meteo{display:flex;align-items:center;gap:10px;min-width:0}
.meteo svg{width:30px;height:30px;flex:none}
.meteo b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.meteo span{display:block;font-size:13px;color:var(--muted);line-height:1.25}

/* Plaque de rue */
.plaque-zone{padding-top:44px}
.plaque{position:relative;background:var(--enamel);border:6px solid var(--frame);border-radius:14px;padding:7px;color:#FFFFFF;box-shadow:var(--shadow)}
.plaque-tab{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--enamel);border:6px solid var(--frame);border-bottom:0;border-radius:12px 12px 0 0;padding:4px 18px 2px;font-family:var(--plaque);font-weight:600;font-size:16px;letter-spacing:.04em;white-space:nowrap}
.plaque-tab sup{font-size:.65em}
.plaque-in{border:2px solid rgba(255,255,255,.92);border-radius:7px;padding:14px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.plaque-kicker{font-family:var(--plaque);font-weight:600;font-size:14px;letter-spacing:.2em;text-transform:uppercase}
.plaque h1{font-family:var(--plaque);font-weight:700;font-size:clamp(52px,16vw,72px);line-height:.95;letter-spacing:.03em;text-transform:uppercase}

.host{display:flex;align-items:center;gap:14px;padding-top:22px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--on);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;flex:none}
.host b{display:block;font-size:16px;font-weight:600}
.host span{display:block;font-size:14px;color:var(--muted);line-height:1.4}

/* Cartes et boutons */
.stack{display:flex;flex-direction:column;gap:12px}
.box{border:1px solid var(--line-strong);border-radius:12px;overflow:hidden}
.box-row{padding:12px 14px;display:flex;align-items:center;gap:12px}
.box-row + .box-row{border-top:1px solid var(--line-strong)}
.label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pwd{font-size:18px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-block{display:flex;width:100%}
.btn-pill{border-radius:999px;border-color:var(--line);min-height:44px;font-size:14px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.row-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--bg);width:100%;text-align:left;cursor:pointer}
.row-link .t{flex:1;min-width:0}
.row-link b{display:block;font-size:15px;font-weight:600}
.row-link span.s{display:block;font-size:13px;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.ico{width:24px;height:24px;flex:none}

.sec{padding-top:28px}
.sec + .sec{border-top:1px solid var(--line-soft);margin-top:28px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec h2{font-size:22px;font-weight:600}
.sec h3{font-size:17px;font-weight:600}
.pill{display:inline-flex;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}

/* Raccourcis */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.shortcut{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;height:96px;padding:16px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);background:var(--bg);text-align:left;cursor:pointer}
.shortcut svg{width:28px;height:28px}
.shortcut span{font-size:15px;font-weight:600;line-height:1.2}

/* Sous-menu collant */
.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line-soft);margin-top:8px}
.subnav .pad{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none}
.subnav a{min-width:44px;text-align:center;padding:12px 0;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.subnav a[aria-current="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
[id^="s-"]{scroll-margin-top:calc(56px + env(safe-area-inset-top,0px))}

/* Liste d'équipements */
.list{display:flex;flex-direction:column}
.list-item{display:flex;align-items:center;gap:16px;min-height:66px;padding:6px 0;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;cursor:pointer;color:var(--ink);text-decoration:none;width:100%}
.list-item:last-child{border-bottom:0}
.list-item .t{flex:1;min-width:0}
.list-item b{display:block;font-size:16px;font-weight:500}
.list-item span.s{display:block;font-size:13px;color:var(--muted)}
.list-item .ico{width:26px;height:26px}

/* Étapes */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:n}
.steps li{display:flex;gap:14px;align-items:flex-start;counter-increment:n}
.steps li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:var(--on);color:var(--on-ink);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.steps.outline li::before{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.steps li span{font-size:15px;line-height:1.45;padding-top:3px}
.callout{padding:14px 16px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);display:flex;flex-direction:column;gap:8px}
.callout b{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--warn-title)}
.callout ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.callout p{margin:0;font-size:14px;line-height:1.45}
.soft{padding:16px;border-radius:16px;background:var(--alt);display:flex;flex-direction:column;gap:12px}
.partner .pt{display:flex;gap:12px;align-items:flex-start}
.partner .pt b{display:block;font-size:15px;font-weight:600}
.partner .pt p{margin:2px 0 0;font-size:14px;line-height:1.45;color:var(--ink2)}
.partner .btn{align-self:flex-start}
.partner p.xs{margin:0}

/* Check-list */
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.check label{display:flex;align-items:center;gap:14px;min-height:54px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;flex:none;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.check input:checked{background:var(--on);border-color:var(--on)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.check span{font-size:15px;line-height:1.4}
.progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--on);border-radius:99px;transition:width .25s}

/* Lignes de transport */
.ln{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--lc);color:var(--lt);font-size:14px;font-weight:700;flex:none;line-height:1}
.ln.rer{border-radius:7px}
.station{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.station b{flex:1;min-width:0;font-size:15px;font-weight:600}
.station .lns{display:flex;gap:5px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.off::before{background:var(--muted)}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--alt)}
.trow .msg{grid-column:2;font-size:14px;line-height:1.4;color:var(--muted)}
.st{justify-self:start;display:inline-flex;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.works,.st.info{background:var(--warn-bg);color:var(--warn)}
.st.warn,.st.crit{background:var(--crit-bg);color:var(--crit)}
.st.unknown{background:var(--alt);color:var(--muted);border:1px solid var(--line)}
.net{display:flex;flex-wrap:wrap;gap:10px}
.net button{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.net button.rer{border-radius:9px}
.net .ln{width:36px;height:36px;font-size:15px}
.net .dot{position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.net button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.dot.ok{background:var(--ok)} .dot.works,.dot.info{background:var(--dot-works)} .dot.warn,.dot.crit{background:var(--crit)} .dot.unknown{background:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}

/* Vélib' */
.vcard{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.vhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.vhead b{display:block;font-size:16px;font-weight:600}
.vstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vstats div{display:flex;flex-direction:column;gap:2px}
.vstats strong{display:flex;align-items:center;gap:6px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.vstats strong svg{width:20px;height:20px}
.vstats span{font-size:12px;color:var(--muted)}
.vbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--line-soft)}
.vbar i{display:block;height:100%}

/* Événements */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--on);border-color:var(--on);color:var(--on-ink)}
.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:22px}
.ev{display:flex;flex-direction:column;gap:10px}
.ev-media{position:relative;aspect-ratio:16/10;max-width:100%;border-radius:16px;overflow:hidden;background:var(--ph)}
.ev-media img{width:100%;height:100%;object-fit:cover;display:block}
.ev-media .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.ev-media .ph svg{width:34px;height:34px}
.ev-free{position:absolute;left:12px;top:12px;padding:5px 10px;border-radius:999px;background:#FFFFFF;color:#222222;font-size:13px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.ev-save{position:absolute;right:6px;top:6px;width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ev-save svg{width:26px;height:26px}
.ev a.ev-link{text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.ev-title{font-size:15px;font-weight:600}
.ev-meta{font-size:15px;color:var(--muted)}
.state{margin:0;padding:14px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:15px}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.exp{flex:none;width:160px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);scroll-snap-align:start}
.exp .img{height:160px;border-radius:12px;background:var(--ph);overflow:hidden}
.exp .img img{width:100%;height:100%;object-fit:cover}
.exp b{font-size:14px;font-weight:600;line-height:1.3}
.place{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.place:last-child{border-bottom:0}
.place .t{flex:1;min-width:0}
.place b{display:block;font-size:15px;font-weight:600}
.place span{display:block;font-size:14px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink);background:var(--bg);cursor:pointer}
.iconbtn svg{width:20px;height:20px}

/* Urgences */
.e112{display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;background:var(--sos-bg);text-decoration:none;color:var(--ink)}
.e112 strong{font-size:44px;font-weight:700;line-height:1;color:var(--sos)}
.e112 .t{flex:1}
.e112 b{display:block;font-size:16px;font-weight:600}
.e112 span{display:block;font-size:14px;color:var(--ink2);line-height:1.35}
.enum{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink)}
.enum strong{font-size:28px;font-weight:700;line-height:1.1;color:var(--sos)}
.enum span{font-size:14px;color:var(--muted);line-height:1.35}
.erow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink)}
.erow strong{font-size:18px;font-weight:700;color:var(--sos);white-space:nowrap}

/* Onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-top:6px;padding-bottom:8px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--accent-text);font-weight:600}

/* Panneau (fiche) */
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;padding:0;border:0;border-radius:16px 16px 0 0;background:var(--bg);color:var(--ink);box-shadow:0 -8px 28px rgba(0,0,0,.2)}
dialog.sheet[open]{display:flex;flex-direction:column;animation:monte .22s ease-out}
dialog.sheet::backdrop{background:rgba(0,0,0,.5)}
@keyframes monte{from{transform:translateY(28px);opacity:.6}}
.grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding:6px 12px 10px;border-bottom:1px solid var(--line-soft);flex:none}
.sheet-head h2{text-align:center;font-size:16px;font-weight:600}
.close{width:44px;height:44px;border:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.close svg{width:18px;height:18px}
.sheet-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px;display:flex;flex-direction:column;gap:22px}
.sheet-body p{margin:0}
.sheet-body .lead{font-size:15px;line-height:1.5;color:var(--ink2)}
.fsec{display:flex;flex-direction:column;gap:10px}
.fsec.sep{padding-top:18px;border-top:1px solid var(--line-soft)}
.fsec.fold{display:block}
.fold > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;cursor:pointer}
.fold > summary::-webkit-details-marker{display:none}
.fold .fchev{width:18px;height:18px;color:var(--muted);transition:transform .2s;flex:none}
.fold[open] .fchev{transform:rotate(90deg)}
.fold-body{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.fsec h3{font-size:17px;font-weight:600}
.fsec .txt{font-size:15px;line-height:1.5;color:var(--ink2)}
.fsec ul.puces{margin:0;padding-left:18px;font-size:15px;line-height:1.5;color:var(--ink2)}
.badge{padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;border-radius:12px;background:var(--alt)}
.seg button{height:44px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.figure{margin:0;display:flex;flex-direction:column;gap:8px}
.figure img{width:100%;height:auto;display:block;border:1px solid var(--line-soft);border-radius:12px;background:#FFFFFF}
.figure figcaption{font-size:13px;color:var(--muted)}
.vid{width:44px;height:44px;border-radius:50%;background:var(--on);color:var(--on-ink);display:flex;align-items:center;justify-content:center;flex:none}
.sheet-foot{display:flex;gap:12px;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft);flex:none}
.sheet-foot .btn{flex:1}
.qrbox{background:#FFFFFF;border-radius:16px;padding:16px;max-width:300px;width:100%;margin:0 auto}
.qrbox svg{display:block;width:100%;height:auto}

/* Écran verrouillé */
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-top:40px;padding-bottom:40px}
.lock p{margin:0;text-align:center;font-size:17px;line-height:1.5}
.lock p + p{color:var(--muted);font-size:15px}
.bye{text-align:center;padding-top:36px;font-family:var(--plaque);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>

    return `<li class="ev"><div class="ev-media">${r.cover_url ? `<img src="${esc(imgEv(r.cover_url))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : `<span class="ph">${svg("image", "", 1.4)}</span>`}
      ${free ? `<span class="ev-free">${esc(u("free"))}</span>` : ""}
      <button class="ev-save" type="button" data-fav="${esc(String(r.id))}" aria-pressed="${fav}" aria-label="${esc(fav ? u("unsave") : u("save"))}"><svg viewBox="0 0 24 24" fill="${fav ? "#D2364D" : "rgba(0,0,0,0.45)"}" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">${P.heart}</svg></button></div>
      <a class="ev-link" href="${esc(r.url || "https://www.paris.fr/quefaire")}" target="_blank" rel="noopener"><span class="ev-title">${esc(r.title)}</span><span class="ev-meta">${esc(quand(s))}</span><span class="ev-meta">${esc(where)}</span></a></li>`;
  }
  async function loadEvents(plus) {
    majFiltres();
    const box = $("#events"); if (!box) return;
    if (!plus) S.evShown = 6;
    let list;
    if (S.ev.saved) {
      list = trierEvenements(S.favoris.filter((f) => f.s.end >= Date.now()).map((f) => ({ r: f.r, s: f.s })));
      if (!list.length) { box.innerHTML = `<p class="state">${esc(u("savedEmpty"))}</p>`; return; }
    } else {
      if (!plus) box.innerHTML = `<p class="state">${esc(u("evLoading"))}</p>`;
      try { list = await fetchEvents(S.ev.scope); } catch (e) { box.innerHTML = `<p class="state">${esc(u("evErr"))}</p>`; return; }
      const finJour = new Date(); finJour.setHours(23, 59, 59, 999);
      if (S.ev.free) list = list.filter((x) => String(x.r.price_type || "").toLowerCase().indexOf("gratuit") === 0);
      if (S.ev.today) list = list.filter((x) => x.s.start <= finJour.getTime() && x.s.end >= Date.now());
      if (!list.length) { box.innerHTML = `<p class="state">${esc(u("evEmpty"))}</p>`; return; }
    }
    S.evList = list;
    const vis = list.slice(0, S.evShown), reste = list.length - vis.length;
    box.innerHTML = `<ul class="events">${vis.map(carteEvenement).join("")}</ul>` + (reste > 0 ? `<button class="btn btn-block" type="button" id="evPlus" style="margin-top:20px">${esc(u("evMoreBtn")(reste))}</button>` : "");
    $$("#events img").forEach((im) => im.addEventListener("error", () => { const ph = document.createElement("span"); ph.className = "ph"; ph.innerHTML = svg("image", "", 1.4); im.replaceWith(ph); }));
    $$("#events [data-fav]").forEach((b) => b.addEventListener("click", () => {
      const ev = S.evList.find((x) => String(x.r.id) === b.dataset.fav); if (!ev) return;
      const on = basculerFavori(ev);
      b.setAttribute("aria-pressed", String(on)); b.setAttribute("aria-label", on ? u("unsave") : u("save"));
      b.querySelector("svg").setAttribute("fill", on ? "#D2364D" : "rgba(0,0,0,0.45)");
      if (S.ev.saved && !on) loadEvents(true); else majFiltres();
    }));
    const pl = $("#evPlus"); if (pl) pl.addEventListener("click", () => { S.evShown += 6; loadEvents(true); });
  }

  /* ───────── Vue Aide ───────── */
  function renderAide() {
    const H = C.hote, Sa = C.sante || {}, PA = C.partenaires || {};
    const nums = [["15", "e15"], ["17", "e17"], ["18", "e18"], ["3237", "e3237"]];
    const wa = H.whatsapp ? String(H.whatsapp).replace(/[^\d]/g, "") : "";
    $("#v-aide").innerHTML = viewHead(u("aideTitle"), u("aideSub")) + `
      <div class="pad">
        <div class="sec" id="s-sos" style="padding-top:20px">
          <div class="stack">
            <a class="e112" href="tel:112"><strong>112</strong><span class="t"><b>${esc(u("e112"))}</b><span>${esc(u("e112sub"))}</span></span></a>
            <div class="grid2">${nums.map((n) => `<a class="enum" href="tel:${n[0]}"><strong>${n[0]}</strong><span>${esc(u(n[1]))}</span></a>`).join("")}</div>
            <a class="erow" href="tel:0147077777"><span><b style="display:block;font-size:16px">${esc(u("sos"))}</b><span class="small muted">${esc(u("sosSub"))}</span></span><strong>01 47 07 77 77</strong></a>
            <p class="xs muted" style="margin:0">${esc(u("e114"))}</p>
          </div>
        </div>
        <div class="sec" id="s-hote">
          <h2 style="margin-bottom:16px">${esc(u("hostTitle"))}</h2>
          <div class="stack" style="gap:16px">
            <div class="host" style="padding:0"><div class="avatar" aria-hidden="true">${esc(H.prenom.charAt(0))}</div><div><b>${esc(H.prenom)}</b><span>${esc(u("hostSub"))}</span></div></div>
            <div class="stack" style="gap:6px">
              <a class="btn btn-primary btn-block" href="https://www.airbnb.fr/" target="_blank" rel="noopener">${svg("msg", "", 1.8)}<span>${esc(u("airbnb"))}</span></a>
              <p class="xs muted" style="margin:0;text-align:center">${esc(u("airbnbSub"))}</p>
            </div>
            ${wa ? `<a class="btn btn-block" href="https://wa.me/${wa}" target="_blank" rel="noopener">${svg("wa", "", 1.7)}<span>${esc(u("whatsapp"))} · ${esc(H.whatsappAffiche || H.whatsapp)}</span></a>` : ""}
          </div>
        </div>
        ${(C.pratique && C.pratique.length) || PA.esim ? `<div class="sec" id="s-pratique">
          <h2 style="margin-bottom:6px">${esc(u("pratique"))}</h2>
          ${(C.pratique || []).map((x) => `<div class="place">${svg(x.icone, "ico", 1.6)}<div class="t"><b>${esc(t(x.titre))}</b><span>${esc(t(x.texte))}</span></div></div>`).join("")}
          ${PA.esim ? `<div style="margin-top:12px">${partnerCard(PA.esim)}</div>` : ""}
        </div>` : ""}
        <div class="sec" id="s-proche">
          <h2 style="margin-bottom:6px">${esc(u("nearby"))}</h2>
          ${Sa.pharmacie ? `<div class="place">${svg("croix", "ico", 1.6)}<div class="t"><b>${esc(Sa.pharmacie.nom)}</b><span>${esc(Sa.pharmacie.adresse)}</span></div><a class="iconbtn" href="${mapsQ(Sa.pharmacie.nom + ", " + Sa.pharmacie.adresse)}" target="_blank" rel="noopener" aria-label="${esc(u("map"))} : ${esc(Sa.pharmacie.nom)}">${svg("pin", "", 1.7)}</a></div>` : ""}
          ${Sa.hopital ? `<div class="place">${svg("hospital", "ico", 1.6)}<div class="t"><b>${esc(Sa.hopital.nom)}</b><span>${esc(Sa.hopital.adresse)}${Sa.hopital.note ? " · " + esc(t(Sa.hopital.note)) : ""}</span></div><a class="iconbtn" href="${mapsQ(Sa.hopital.nom + ", " + Sa.hopital.adresse)}" target="_blank" rel="noopener" aria-label="${esc(u("map"))} : ${esc(Sa.hopital.nom)}">${svg("pin", "", 1.7)}</a></div>` : ""}
        </div>
      </div>`;
  }

  /* ───────── Onglets, navigation ───────── */
  const TABS = [["accueil", "homeTab"], ["studio", "lit"], ["transports", "trainTab"], ["sorties", "cal"], ["aide", "croix"]];
  function renderTabbar() {
    $("#tabbar").innerHTML = TABS.map((x) => `<button type="button" data-tab="${x[0]}"${S.tab === x[0] ? ' aria-current="page"' : ""}>${svg(x[1], "", 1.8)}<span>${esc(u("tab_" + x[0]))}</span></button>`).join("");
  }
  // mode : rien = nouvelle étape dans l'historique, "pop" = bouton retour, "replace" = remplace l'étape courante
  function go(tab, anchor, mode) {
    if (mode === "pop" && tab === S.tab) return;
    const change = tab !== S.tab;
    S.tab = tab;
    try {
      if (mode === "replace") history.replaceState({ tab }, "");
      else if (mode !== "pop" && change) history.pushState({ tab }, "");
    } catch (e) {}
    TABS.forEach((x) => { $("#v-" + x[0]).hidden = x[0] !== tab; });
    renderTabbar();
    if (anchor) { const a = document.getElementById(anchor); if (a) { a.scrollIntoView({ block: "start" }); return; } }
    window.scrollTo(0, 0);
  }
  addEventListener("popstate", (e) => {
    if (dlg.open) { closeSheet("pop"); return; }
    if (!C) return;
    go((e.state && e.state.tab) || "accueil", null, "pop");
  });
  document.addEventListener("click", (e) => {
    const l = e.target.closest("[data-lang]");
    if (l) { if (l.dataset.lang !== LANG) { LANG = l.dataset.lang; store.set("livret-langue", LANG); renderAll(); } return; }
    const tb = e.target.closest("[data-tab]"); if (tb) { go(tb.dataset.tab); return; }
    const g = e.target.closest("[data-go]"); if (g) { const p = g.dataset.go.split(":"); go(p[0], p[1]); return; }
    const s = e.target.closest("[data-sc]"); if (s) { const p = SC[s.dataset.sc].split(":"); go(p[0], p[1]); return; }
    const sn = e.target.closest("[data-sub]");
    if (sn) { e.preventDefault(); const tgt = document.getElementById(sn.getAttribute("href").slice(1)); if (tgt) tgt.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  });
  let spy = null;
  function scrollSpy() {
    if (spy) spy.disconnect();
    if (!("IntersectionObserver" in window)) return;
    spy = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (!en.isIntersecting) return;
        const id = en.target.id, nav = en.target.closest(".view").querySelector(".subnav");
        if (nav) $$("a", nav).forEach((a) => a.setAttribute("aria-current", String(a.getAttribute("href") === "#" + id)));
      });
    }, { rootMargin: "-70px 0px -60% 0px" });
    $$(".view .sec[id]").forEach((s) => spy.observe(s));
  }

  /* ───────── Météo (Open-Meteo, sans clé) ───────── */
  async function loadWeather() {
    const L = C.logement;
    try {
      const j = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${L.latitude}&longitude=${L.longitude}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis&forecast_days=1`);
      S.weather = { t: j.current.temperature_2m, c: j.current.weather_code, max: j.daily.temperature_2m_max[0], min: j.daily.temperature_2m_min[0] };
    } catch (e) { S.weather = null; }
    const m = $("#meteo"); if (m) m.outerHTML = meteoHtml();
  }

  function renderAll() {
    document.documentElement.lang = LANG;
    renderAccueil(); renderStudio(); renderTransports(); renderSorties(); renderAide(); renderTabbar();
    TABS.forEach((x) => { $("#v-" + x[0]).hidden = x[0] !== S.tab; });
    scrollSpy();
    if (dlg.open && typeof S.openFiche === "number") renderFiche(S.openFiche);
    else if (dlg.open && S.openFiche === "qr") renderQr();
  }

  /* ───────── Démarrage ───────── */
  function verrou(k) {
    $("#app").hidden = true; $("#lock").hidden = false;
    $("#lockMsg").textContent = LOCK[k][0]; $("#lockMsgEn").textContent = LOCK[k][1];
  }
  const CLE_JOURS = 30; // un ancien voyageur perd l'accès un mois après son dernier scan
  async function demarrer() {
    let secret = null;
    const h = location.hash.slice(1);
    const neuf = /^[A-Za-z0-9_-]{16,64}$/.test(h);
    if (neuf) { secret = h; store.set("livret-cle", { k: h, t: Date.now() }); }
    else {
      const m = store.get("livret-cle", null), o = typeof m === "string" ? { k: m, t: Date.now() } : m;
      if (o && o.k && Date.now() - (o.t || 0) < CLE_JOURS * 864e5) secret = o.k; else store.del("livret-cle");
    }
    try { history.replaceState({ tab: "accueil" }, "", location.pathname + location.search); } catch (e) {}
    if (!secret) return verrou("none");
    try { C = await ouvrir(secret); }
    catch (e) {
      if (e && e.cle) { store.del("livret-cle"); return verrou(neuf ? "bad" : "none"); }
      return verrou("net");
    }
    $("#lock").hidden = true; $("#app").hidden = false;
    renderAll();
    loadWeather(); loadTraffic(); loadVelib();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    setInterval(() => { const c = $("#clock"); if (c) c.textContent = hm(new Date()); }, 15000);
    setInterval(() => { if (!document.hidden) { loadVelib(); if (S.traffic.state === "ok") loadTraffic(); } }, 120000);
  }
  demarrer();
})();
</script>
